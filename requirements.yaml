# requirements-yaml — one line per requirement, edit by hand.
# line:   <ID>: observable capability; so that value.
# groups: functional(area -> "As a <role>, I can:" -> ID) · non_functional & domain sections(group -> ID) · deferred(area -> "[deferred] ID")
# ids:    PREFIX-NN, uppercase, stable, never reused.
# docs:   optional map (kept at the file's end) of <filename> -> description of what it is and when to read it.
# goals/non_goals: optional lists, kept first, set only by the human — one distilled line each, not requirements: no IDs, no clauses.
# roles:  optional map (kept before functional) of <role> -> who they are; names match the "As a <role>" headings.
# yaml-language-server: $schema=./requirements.schema.json
goals:
  - stay in the flow with github and paseo
functional:
  sources:
    As a developer, I can:
      SRC-01: choose which GitHub organizations and repositories Attention Span covers; so that it works for any project.
      SRC-02: choose those organizations and repositories in the app, each checked on GitHub as I add it; so that I don't edit files on the daemon's machine and a typo shows right away.
  setup:
    As a developer, I can:
      SET-01: see what's missing and how to fix it when Attention Span can't load, along with what it covers and which projects and agent it will use; so that getting started doesn't end at an error.
  attention:
    As a developer, I can:
      ATT-01: see in one place the open issues and pull requests that need me; so that I don't depend on noisy GitHub notifications.
      ATT-02: see why each item needs me, with items grouped by that reason; so that I know what to do about an item at a glance.
      ATT-03: see an issue and the pull requests that resolve it as one item, led by the issue; so that related work isn't scattered across the list.
      ATT-04: see a stack of dependent pull requests as one item; so that a stack is handled as the single change it is.
      ATT-05: judge an item from the list without opening it; so that triage is quick and I'm not visually overloaded.
      ATT-06: open an item for more detail and every action, each saying what it will do; so that the list stays minimal by default and pressing a button makes sense.
      ATT-07: see whether an item already has a Paseo session and what its agent is doing; so that I don't start duplicate work.
      ATT-08: dismiss an item until something new happens on it; so that FYIs stop taking up space.
      ATT-09: notice how many items need me from anywhere in Paseo; so that I don't have to open Attention Span to check.
      ATT-11: see work that has waited on others for too long; so that stalled work gets nudged.
      ATT-12: open any item on GitHub; so that I can do what Attention Span doesn't cover.
      ATT-13: tell at a glance which actions start an agent session and which change GitHub right away; so that I know what a tap will do.
      ATT-14: undo a change on GitHub right after making it, where GitHub allows; so that a mis-tap costs nothing without confirming every action.
      ATT-15: copy any item's GitHub link; so that I can share it without opening GitHub.
  mentions:
    As a developer, I can:
      MEN-01: see open threads where a person mentioned me and is still waiting for my response; so that I only hear about mentions when someone is waiting for me.
      MEN-02: clear a mention by either replying or reacting; so that acknowledging is enough.
      MEN-03: see mentions in other people's drafts; so that I can respond when someone asks me for an early look.
      MEN-04: have mentions of my teams left out; so that only mentions aimed at me personally count.
      MEN-05: see threads a bot opened that I need to resolve; so that bot findings that need me are included.
      MEN-06: tell at a glance when a bot is the one waiting; so that bots are highlighted.
      MEN-07: react 👍 to the comments waiting on me from Attention Span, after reading them in full and picking which; so that acknowledging doesn't need a trip to GitHub.
  reviews:
    As a developer, I can:
      REV-01: see pull requests where my review is requested by name; so that I don't hold up others.
  own_pull_requests:
    As a developer, I can:
      PRS-01: see my pull requests whose checks fail; so that I fix them before they block review or merge.
      PRS-02: see my pull requests with requested changes or unresolved review comments; so that I finish ongoing work, since I can only handle so many tasks at once.
      PRS-03: see my pull requests that are ready to merge; so that finished work ships.
      PRS-04: merge a ready pull request once its checks pass against its current base; so that what merges was tested against what it merges into.
      PRS-05: see my drafts after everything that isn't a draft; so that I finish or close my drafts before picking up new work.
      PRS-06: see only my own drafts as work items; so that other people's unfinished work stays out of my list.
      PRS-07: refresh or close a draft that has gone stale; so that old drafts don't linger.
      PRS-08: have my pull requests that are assigned to someone else left out; so that pull requests I've handed over don't count as mine.
      PRS-09: rerun the failed checks of a pull request without an agent, after seeing which failed and whether they were rerun before; so that flaky checks don't cost a session.
      PRS-10: turn on auto-merge for an approved pull request whose checks are still running; so that it ships without me waiting for CI.
      PRS-11: mark a healthy draft ready for review in one step; so that finished drafts reach reviewers.
  upstream:
    As a developer, I can:
      UPS-01: see my pull requests that conflict with their base; so that pull requests needing updates from upstream are easy to fix.
      UPS-02: see when a pull request in a stack no longer builds on its parent's latest version; so that pull requests needing updates from upstream are easy to fix.
      UPS-03: bring a conflict-free pull request up to date with its base in one step; so that pull requests needing updates from upstream are easy to fix.
      UPS-04: have an agent bring a pull request or a whole stack up to date, resolving conflicts; so that pull requests needing updates from upstream are easy to fix.
      UPS-05: approve an agent's conflict resolution before it is pushed; so that I stay in control of changes I didn't write.
      UPS-06: have an update without conflicts pushed without waiting for me; so that routine updates take no attention.
      UPS-07: see that a pull request is behind its base only when that blocks or risks its merge; so that the list isn't flooded by a base that moves every day.
  sessions:
    As a developer, I can:
      SES-01: start a Paseo session for an item in one step, with defaults suited to why it needs me; so that acting on an item takes no setup.
      SES-02: choose the workspace, agent profile, and prompt before a session starts; so that I can adjust when the defaults don't fit.
      SES-03: open an item's existing session from the item whatever state it is in, including one started on any of its pull requests, and start another only on purpose; so that work on an item stays in one place.
      SES-04: start a session that already has the item's context, such as failing checks or unresolved comments; so that the agent starts informed.
      SES-05: start sessions in my local checkout of the item's repository without configuring paths; so that new repositories work without setup.
      SES-06: start sessions even when no agent profiles are configured; so that Attention Span works before I've set anything up.
      SES-07: start a session on an issue in the repository its code lives in, chosen right there the first time; so that issues kept in a separate repository work without editing files.
  next_up:
    As a developer, I can:
      NXT-01: see open issues nobody is assigned to, apart from the work that needs me; so that I can get an idea of what to do next.
      NXT-02: see unclaimed issues ordered by priority, then effort, then age; so that the most important quick wins come first.
      NXT-03: filter unclaimed issues by scope, and have my choice remembered; so that I only see work I'd pick up.
      NXT-04: choose in the app where unclaimed issues come from (my own repositories, organizations I belong to, or single repositories) and choose which issue fields the list uses; so that the plugin can be used elsewhere without editing files.
      NXT-05: claim an issue and start a session on it in one step; so that teammates see it's taken and I can start right away.
      NXT-06: see issues assigned to me before unclaimed ones; so that I finish what I've taken before picking more.
      NXT-07: claim an issue without starting a session, and give back one assigned to me; so that what I've taken matches what I'll do.
      NXT-08: see unclaimed issues from the repositories of my Paseo projects when I haven't chosen any; so that Next up is useful without setup and never fills with strangers' issues.
      NXT-09: filter unclaimed issues by where they came from, and have my choice remembered; so that I can focus on one source at a time.
      NXT-10: see on each issue its repository, priority, effort and scope at a glance, and whether an open pull request already closes it and by whom; so that I can judge whether to pick it up without opening it.
      NXT-11: close an issue from Next up as completed or not planned, with an optional comment, and undo it; so that work that's done or won't be done stops being suggested.
  waiting:
    As a developer, I can:
      WAI-01: see my work that is waiting on others, grouped by what it waits for; so that I know that work is tracked.
  history:
    As a developer, I can:
      HIS-01: see the issues and pull requests I finished, grouped by week; so that I can tell others what I got done.
      HIS-02: see pull requests I reviewed that merged, apart from my own work; so that I can tell others what I got done.
      HIS-03: copy a week's finished work as a Markdown list of links; so that reporting progress is one paste.

non_functional:
  github_usage:
    GH-01: keeps its load on GitHub's API light; so that we don't bombard GitHub's API.
  safety:
    SAFE-01: changes nothing on GitHub unless I asked for that change; so that nothing is published in my name by surprise.
  security:
    SEC-01: uses the GitHub sign-in already on its host and stores no GitHub credentials of its own; so that there is no extra secret to protect.
  privacy:
    PRIV-01: may keep a local copy of the GitHub data it shows; so that Attention Span shows instantly after a restart.
  reach:
    REACH-01: works in Paseo on both phone and desktop; so that I can triage from anywhere.
  freshness:
    FRESH-01: stays current without me refreshing it; so that its count can be trusted.
    FRESH-02: shows what I just did on GitHub right away, and keeps showing it until GitHub's search catches up; so that I never refresh to see it.

docs:
  CONTRIBUTING.md: how to check, preview the screens in isolation, and install — read before changing UI or tooling.
  docs/architecture.md: how Attention Span meets these requirements (sections, rules, actions, GitHub requests) — read before changing behaviour or adding a requirement.
